<!--
  ════════════════════════════════════════════════════════════════
  SECCIÓN CONTACTO · HR Influence Strategy
  Pegá este bloque completo dentro de tu index.html, en el lugar
  donde quieras que aparezca la sección de contacto (por ejemplo,
  antes del footer).

  ✅ La URL de Apps Script YA está cargada (const ENDPOINT, más abajo).
     No tenés que editar nada: pegá este bloque en tu index.html y subí.
  ════════════════════════════════════════════════════════════════
-->
<section id="contacto" class="hris-contacto">
  <div class="hris-contacto__inner">
    <p class="hris-contacto__kicker">Contacto</p>
    <h2 class="hris-contacto__title">
      Hablemos en el <em>lenguaje</em><br />de tu próxima generación.
    </h2>
    <p class="hris-contacto__lead">
      Contanos sobre tu equipo y qué necesitás comunicar. Te escribimos
      para coordinar una primera charla, sin compromiso.
    </p>

    <form class="hris-form" id="hris-form" novalidate>
      <div class="hris-form__row">
        <label class="hris-field">
          <span>Nombre y apellido *</span>
          <input type="text" name="nombre" required autocomplete="name" />
        </label>
        <label class="hris-field">
          <span>Email *</span>
          <input type="email" name="email" required autocomplete="email" />
        </label>
      </div>
      <div class="hris-form__row">
        <label class="hris-field">
          <span>Empresa *</span>
          <input type="text" name="empresa" required autocomplete="organization" />
        </label>
        <label class="hris-field">
          <span>Tu rol</span>
          <input type="text" name="rol" autocomplete="organization-title" placeholder="Ej: Generalista de RRHH" />
        </label>
      </div>
      <label class="hris-field">
        <span>¿Qué te gustaría lograr?</span>
        <textarea name="mensaje" rows="4" placeholder="Contanos un poco sobre tu equipo y tu objetivo…"></textarea>
      </label>

      <input type="hidden" name="origen" value="landing-contacto" />
      <!-- Honeypot anti-spam: no lo toques, queda oculto -->
      <input type="text" name="website" class="hris-hp" tabindex="-1" autocomplete="off" aria-hidden="true" />

      <div class="hris-form__foot">
        <button type="submit" class="hris-btn" id="hris-submit">Enviar mensaje</button>
        <p class="hris-form__error" id="hris-error" role="alert"></p>
      </div>
    </form>
  </div>
</section>

<style>
  .hris-contacto{
    --bg:#0A0A0C;
    --cream:#EFE9DC;
    --cream-soft:#B7B2A7;
    --line:rgba(239,233,220,.16);
    --rose:#EC6A7C;
    background:var(--bg);
    color:var(--cream);
    padding:96px 24px;
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
  }
  .hris-contacto__inner{max-width:720px;margin:0 auto}
  .hris-contacto__kicker{
    color:var(--rose);
    text-transform:uppercase;
    letter-spacing:.18em;
    font-size:.72rem;
    font-weight:600;
    margin-bottom:18px;
  }
  .hris-contacto__title{
    font-size:clamp(2rem,5vw,3rem);
    line-height:1.06;
    font-weight:600;
    letter-spacing:-.02em;
    margin-bottom:18px;
  }
  .hris-contacto__title em{
    font-family:"Instrument Serif",Georgia,serif;
    font-style:italic;
    font-weight:400;
  }
  .hris-contacto__lead{
    color:var(--cream-soft);
    font-size:1.05rem;
    line-height:1.6;
    max-width:520px;
    margin-bottom:44px;
  }
  .hris-form__row{display:flex;gap:18px;margin-bottom:18px}
  .hris-field{display:flex;flex-direction:column;flex:1;margin-bottom:18px}
  .hris-form__row .hris-field{margin-bottom:0}
  .hris-field span{
    font-size:.8rem;
    color:var(--cream-soft);
    margin-bottom:8px;
    letter-spacing:.02em;
  }
  .hris-field input,
  .hris-field textarea{
    background:transparent;
    border:1px solid var(--line);
    color:var(--cream);
    padding:13px 15px;
    font-family:inherit;
    font-size:1rem;
    outline:none;
    transition:border-color .18s ease;
    border-radius:0;
  }
  .hris-field input:focus,
  .hris-field textarea:focus{border-color:var(--rose)}
  .hris-field textarea{resize:vertical;min-height:110px}
  .hris-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .hris-form__foot{display:flex;align-items:center;gap:20px;margin-top:28px;flex-wrap:wrap}
  .hris-btn{
    background:var(--cream);
    color:var(--bg);
    border:1px solid var(--cream);
    padding:15px 34px;
    font-family:inherit;
    font-weight:600;
    font-size:.95rem;
    cursor:pointer;
    border-radius:0;
    transition:background .18s ease,color .18s ease;
  }
  .hris-btn:hover{background:transparent;color:var(--cream)}
  .hris-btn:disabled{opacity:.5;cursor:default}
  .hris-form__error{color:var(--rose);font-size:.9rem;margin:0}
  @media (max-width:640px){
    .hris-form__row{flex-direction:column;gap:0}
    .hris-contacto{padding:72px 20px}
  }
</style>

<script>
  (function () {
    // ⚠️ REEMPLAZÁ ESTA URL por la de tu Apps Script (termina en /exec)
    const ENDPOINT = "https://script.google.com/macros/s/AKfycbzkAULvf5inVfdNN0CENg_QGqYUy2j9TDOAmaciqvyoyavAMF1aDxEDgK8VyToefq6vgw/exec";

    const form = document.getElementById("hris-form");
    const btn = document.getElementById("hris-submit");
    const errorBox = document.getElementById("hris-error");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      errorBox.textContent = "";

      // Anti-spam: si el honeypot tiene contenido, es un bot → cortamos silenciosamente
      if (form.website.value.trim() !== "") return;

      const nombre = form.nombre.value.trim();
      const email = form.email.value.trim();
      const empresa = form.empresa.value.trim();

      if (!nombre || !email || !empresa) {
        errorBox.textContent = "Completá nombre, email y empresa para continuar.";
        return;
      }
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if (!emailOk) {
        errorBox.textContent = "Revisá el email, parece incompleto.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Enviando…";

      const data = new URLSearchParams();
      data.append("nombre", nombre);
      data.append("email", email);
      data.append("empresa", empresa);
      data.append("rol", form.rol.value.trim());
      data.append("mensaje", form.mensaje.value.trim());
      data.append("origen", form.origen.value);

      fetch(ENDPOINT, { method: "POST", mode: "no-cors", body: data })
        .then(function () {
          window.location.href = "/gracias.html";
        })
        .catch(function () {
          // Con mode:no-cors casi nunca entra acá, pero por las dudas:
          window.location.href = "/gracias.html";
        });
    });
  })();
</script>
